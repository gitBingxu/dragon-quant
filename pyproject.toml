[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dragon_quant", "dragon_quant.*", "web_ui", "web_ui.*"]

[tool.setuptools.package-data]
web_ui = ["dist/**/*"]

[project]
name = "dragon-quant"
version = "0.6.0"
description = "龙头战法四维量化筛选系统 — A股涨停板龙头识别工具"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.30",
    "tmdx>=3.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]

[[project.authors]]
name = "gitBingxu"

[project.urls]
repository = "https://github.com/gitBingxu/dragon-quant"
Changelog = "https://github.com/gitBingxu/dragon-quant/releases"

[project.scripts]
dragon-quant = "dragon_quant.cli:main"

[tool.ruff]
# 项目风格：行宽 120（不强制 88）；只查 E/F 正确性规则，不做 import 排序 / pyupgrade。
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F"]

[tool.ruff.lint.per-file-ignores]
# 重导出模块（公共 API 兼容层），F401 是有意为之
"dragon_quant/storage/db.py" = ["F401"]
"dragon_quant/__init__.py" = ["F401"]
"dragon_quant/logging/__init__.py" = ["F401"]

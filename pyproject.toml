[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dragon_quant", "dragon_quant.*", "web_ui", "web_ui.*"]
exclude = ["dragon_quant.tests", "dragon_quant.tests.*"]

[tool.setuptools.package-data]
web_ui = ["dist/**/*"]

[project]
name = "dragon-quant"
version = "0.7.4"
description = "龙头战法五维量化筛选系统 — A股涨停板龙头识别工具"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.30",
    "tmdx>=3.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial :: Investment",
]

[project.optional-dependencies]
# 本地 Web 仪表盘（`dragon-quant dashboard`）。基础安装不含这些依赖；
# 首次调用 dashboard 会询问是否安装，失败时给出手动指令。
web = [
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
]
# 贡献者：`pip install -e ".[dev]"`（TestClient 需要 httpx）。
dev = [
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
    "httpx>=0.27",
]

[[project.authors]]
name = "gitBingxu"
[project.urls]
repository = "https://github.com/gitBingxu/dragon-quant"
Changelog = "https://github.com/gitBingxu/dragon-quant/releases"

[project.scripts]
dragon-quant = "dragon_quant.cli:main"

[tool.ruff]
# 项目风格：行宽 120（不强制 88）；只查 E/F 正确性规则，不做 import 排序 / pyupgrade。
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F"]

[tool.ruff.lint.per-file-ignores]
# 重导出模块（公共 API 兼容层），F401 是有意为之
"dragon_quant/infra/storage/main.py" = ["F401"]
"dragon_quant/__init__.py" = ["F401"]
"dragon_quant/scan/logger/main.py" = ["F401"]
